name: Mirror upstream release

# 每天检查 open-octo/octo-agent 的最新版本，把 Linux 二进制和 checksums 镜像到本仓库 Releases。
# 上游失联/删库时什么也不做，已有镜像保持不变。
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UP: open-octo/octo-agent
          ME: ${{ github.repository }}
        run: |
          set -eu
          tag=$(gh release view -R "$UP" --json tagName -q .tagName 2>/dev/null) || { echo "upstream unreachable, keeping mirror"; exit 0; }
          if gh release view "$tag" -R "$ME" >/dev/null 2>&1; then echo "already mirrored $tag"; exit 0; fi
          mkdir dl && cd dl
          gh release download "$tag" -R "$UP" -p checksums.txt -p '*_linux_amd64.tar.gz' -p '*_linux_arm64.tar.gz'
          sha256sum -c --ignore-missing checksums.txt
          gh release create "$tag" -R "$ME" --title "$tag (mirror)" --notes "Mirror of $UP $tag Linux binaries." --latest ./*
      - name: Sync source (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
